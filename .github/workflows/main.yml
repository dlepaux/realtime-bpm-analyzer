name: Main Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Manual retry when a release fails after its commit landed (e.g. npm's provenance step).
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
  pages: write

# Pushes to main share one group so releases and Pages deploys never overlap. Each PR
# gets its own: GitHub keeps one pending run per group, so a shared group silently
# cancelled the PR runs queued behind a Renovate batch (3 of 5 on 2026-10-15).
concurrency:
  group: main-pipeline-${{ github.event_name == 'push' && 'main' || github.ref }}
  cancel-in-progress: false

jobs:
  # Build and test once
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.0
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify integrity
        run: npm audit signatures

      - name: Audit dependencies (fail on high, minus bin/audit-gate.mjs allowlist)
        run: |
          node bin/audit-gate.mjs --self-test
          (npm audit --json || true) | node bin/audit-gate.mjs

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # The realtime-bpm-analyzer/node entry, built above, in plain Node without Web Audio
      - name: Test Node entry
        run: npm run test:node

      # docs/ is a workspace now: the root install and audit above already cover it
      - name: Docs typecheck
        run: npm run typecheck -w docs

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            packages/realtime-bpm-analyzer/dist/
            packages/realtime-bpm-analyzer/src/generated-processor.ts
          retention-days: 1

  # Release to GitHub and npm. release-please keeps one release PR open per package
  # (version bump + changelog, from the conventional commits under that package's path).
  # Merging it lands here: release-please tags vX.Y.Z and writes the GitHub release, then
  # the publish step ships whatever version the library's package.json names that npm
  # does not have yet. Keying on the registry, not on the action's output, makes a
  # re-run after a failed publish safe: it publishes the missing version, or nothing.
  release:
    name: Release
    needs: build
    # workflow_dispatch can target any branch; only main ever releases
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Release PR, tag and GitHub release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.0
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Check whether this library version is on npm
        id: unpublished
        working-directory: packages/realtime-bpm-analyzer
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "realtime-bpm-analyzer@$version" version >/dev/null 2>&1; then
            echo "realtime-bpm-analyzer@$version is already on npm: nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "realtime-bpm-analyzer@$version is not on npm yet: publishing"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.unpublished.outputs.publish == 'true'
        run: npm ci

      - name: Download build artifacts
        if: steps.unpublished.outputs.publish == 'true'
        uses: actions/download-artifact@v8
        with:
          name: dist
          # upload-artifact strips the paths' common ancestor (the package folder)
          path: packages/realtime-bpm-analyzer

      # npm's trusted publisher (OIDC, no token) is bound to this workflow file name:
      # renaming main.yml means redoing the trusted-publisher setup on npmjs.com.
      # prepack copies the root readme.md and license.md into the package first.
      - name: Publish to npm
        if: steps.unpublished.outputs.publish == 'true'
        working-directory: packages/realtime-bpm-analyzer
        run: npm publish --provenance --access public

  # Build the docs and all examples on every run, so a dependency PR that breaks them
  # goes red before it merges (#232 merged green, then broke three examples on main:
  # this job used to run on push only). Only the Pages deploy stays push-only.
  docs:
    name: Build Documentation
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.0
          cache: npm

      - name: Install dependencies (root, library, docs and examples workspaces)
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          # upload-artifact strips the paths' common ancestor (the package folder)
          path: packages/realtime-bpm-analyzer

      - name: Docs typecheck
        run: npm run typecheck -w docs

      - name: Docs lint
        run: npm run lint -w docs

      - name: Docs tests
        run: npm test -w docs

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Build documentation
        run: npm run build -w docs

      # VitePress hydrates each page from a *.lean.js chunk. A Vite it doesn't support (vite 8, #218)
      # builds green but emits none, and every page then 404s its chunk in the browser.
      - name: Check VitePress lean chunks
        run: |
          dist=docs/.vitepress/dist
          lean=$(find "$dist/assets" -name '*.lean.js' | wc -l)
          pages=$(jq length "$dist/hashmap.json")
          echo "lean chunks: $lean, pages: $pages"
          test "$pages" -gt 0 && test "$lean" -ge "$pages"

      - name: Upload pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  docs-deploy:
    name: Deploy Documentation
    needs: docs
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
