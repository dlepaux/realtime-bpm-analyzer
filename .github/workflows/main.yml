name: Main Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
  pages: write

# Pushes to main share one group so releases and Pages deploys never overlap. Each PR
# gets its own: GitHub keeps one pending run per group, so a shared group silently
# cancelled the PR runs queued behind a Renovate batch (3 of 5 on 2026-10-15).
concurrency:
  group: main-pipeline-${{ github.event_name == 'push' && 'main' || github.ref }}
  cancel-in-progress: false

jobs:
  # Build and test once
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.0
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify integrity
        run: npm audit signatures

      - name: Audit dependencies (fail on high, minus bin/audit-gate.mjs allowlist)
        run: |
          node bin/audit-gate.mjs --self-test
          (npm audit --json || true) | node bin/audit-gate.mjs

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Docs typecheck
        run: cd docs && npm ci && npm run typecheck

      - name: Audit docs dependencies (fail on high)
        run: cd docs && npm audit --audit-level=high

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            dist/
            src/generated-processor.ts
          retention-days: 1

  # Release to GitHub and npm
  release:
    name: Release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.0
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

  # Build the docs and all examples on every run, so a dependency PR that breaks them
  # goes red before it merges (#232 merged green, then broke three examples on main:
  # this job used to run on push only). Only the Pages deploy stays push-only.
  docs:
    name: Build Documentation
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.0
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist

      - name: Install docs dependencies
        run: cd docs && npm ci

      - name: Docs typecheck
        run: cd docs && npm run typecheck

      - name: Docs lint
        run: cd docs && npm run lint

      - name: Docs tests
        run: cd docs && npm test

      - name: Setup Pages
        if: github.event_name == 'push'
        uses: actions/configure-pages@v6

      - name: Build documentation
        run: cd docs && npm run build

      # VitePress fails the build on dead links, but only inside docs/: the root markdown
      # files are never read by it, and they point at the site through full URLs. Both dead
      # README links (8b71c6b) slipped through that gap. This checks the root files offline:
      # relative links on disk, and our own site's URLs remapped onto the dist just built.
      # --offline only narrows the schemes to file, and lychee applies --remap before that
      # filter (lychee-lib client.rs, v0.24.2), so remapped URLs are checked while every
      # other host is skipped; third-party URLs belong to links.yml. cleanUrls pages resolve
      # through the .html fallback, directories (the bare domain, /api, /examples) through
      # index.html. The apex and http forms are remapped too, so none is skipped silently.
      # Blocking on pushes as well: a dead link stops the Pages deploy, as a dead link
      # inside docs/ already does. Pinned by commit, since the job's token can write.
      - name: Check root markdown links against the built site
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: >-
            --offline --no-progress
            --index-files index.html --fallback-extensions html
            --remap '^https?://(?:www\.)?realtime-bpm-analyzer\.com(/.*)?$ file://${{ github.workspace }}/docs/.vitepress/dist$1'
            './*.md'

      - name: Upload pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  docs-deploy:
    name: Deploy Documentation
    needs: docs
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
